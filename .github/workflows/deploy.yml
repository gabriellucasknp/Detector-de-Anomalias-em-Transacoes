# =====================================================================
# CI/CD Pipeline - Deploy automático para AWS ECS
# Dispara em push para main: testa → build → push ECR → deploy ECS
# =====================================================================
name: CI/CD - Deploy AWS

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:

env:
    AWS_REGION: us-east-1
    ECR_REPOSITORY: anomaly-detector
    ECS_CLUSTER: anomaly-detector-cluster
    ECS_SERVICE: anomaly-detector-service
    CONTAINER_NAME: anomaly-detector-app

jobs:
    # -------------------------------------------------------------------
    # Job 1: Testes e qualidade de código
    # -------------------------------------------------------------------
    test:
        name: Testes e Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Setup Java (para PySpark)
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Lint (black + isort)
              run: |
                  black --check src/ tests/ app.py main.py || true
                  isort --check-only src/ tests/ app.py main.py || true

            - name: Run tests
              run: pytest tests/ -v --cov=src --cov-report=term-missing

    # -------------------------------------------------------------------
    # Job 2: Build da imagem Docker e push para ECR
    # -------------------------------------------------------------------
    build-and-push:
        name: Build & Push Docker to ECR
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        outputs:
            image: ${{ steps.build.outputs.image }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build & Push Docker image
              id: build
              env:
                  ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  docker build -f deploy/Dockerfile.prod -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
                  echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # -------------------------------------------------------------------
    # Job 3: Deploy para ECS
    # -------------------------------------------------------------------
    deploy:
        name: Deploy to ECS Fargate
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Update ECS task definition
              id: task-def
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                  task-definition: deploy/ecs-task-definition.json
                  container-name: ${{ env.CONTAINER_NAME }}
                  image: ${{ needs.build-and-push.outputs.image }}

            - name: Deploy to ECS
              uses: aws-actions/amazon-ecs-deploy-task-definition@v1
              with:
                  task-definition: ${{ steps.task-def.outputs.task-definition }}
                  cluster: ${{ env.ECS_CLUSTER }}
                  service: ${{ env.ECS_SERVICE }}
                  wait-for-service-stability: true
